name: 部署源插件

on:
  push:
    branches: [main]
    paths: ['install/*.zip', 'install/*.ZIP']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-provider-plugins
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: 解压并更新检索清单
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scripts/deploy.py "$RUNNER_TEMP/plugin-errors.txt"
            git add -- install plugins catalog.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m '部署源插件并更新清单'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: 检查未部署的 ZIP
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/plugin-errors.txt" ]; then
            cat "$RUNNER_TEMP/plugin-errors.txt"
            exit 1
          fi
